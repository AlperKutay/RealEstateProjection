<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real Estate Projection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<div x-data="projectionApp()" x-init="init()" class="max-w-[1800px] mx-auto p-4 lg:p-6">

  <!-- Header -->
  <header class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
    <div>
      <h1 class="text-2xl lg:text-3xl font-bold flex items-center gap-2">
        <span>🏠</span>
        <span x-text="t('title')"></span>
      </h1>
      <p class="text-slate-400 text-sm mt-1" x-text="t('subtitle')"></p>
    </div>
    <div class="flex items-center gap-2">
      <button @click="lang='tr'" :class="lang==='tr' ? 'bg-emerald-600' : 'bg-slate-800'"
              class="px-3 py-1 rounded text-sm font-semibold">TR</button>
      <button @click="lang='en'" :class="lang==='en' ? 'bg-emerald-600' : 'bg-slate-800'"
              class="px-3 py-1 rounded text-sm font-semibold">EN</button>
    </div>
  </header>

  <div class="space-y-6">

    <!-- Top: form -->
    <section class="space-y-4">

      <!-- Row 1: numeric inputs -->
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">

        <!-- Loan -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800">
          <h2 class="section-title" x-text="t('loan')"></h2>
          <div class="grid grid-cols-2 gap-3">
            <label class="field">
              <span class="field-label" x-text="t('years')"></span>
              <input type="number" min="1" max="30" x-model.number="form.years" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('interest_rate')"></span>
              <input type="number" step="0.01" x-model.number="form.interest_rate" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('value_of_house')"></span>
              <input type="number" step="0.01" x-model.number="houseValueM" class="input-field" />
              <span class="field-hint" x-text="form.value_of_house_tl.toLocaleString() + ' TL'"></span>
            </label>
            <label class="field">
              <span class="field-label" x-text="t('down_payment')"></span>
              <input type="number" step="0.01" x-model.number="downPaymentM" class="input-field" />
              <span class="field-hint" x-text="form.initial_noncredit_amount_tl.toLocaleString() + ' TL'"></span>
            </label>
          </div>
          <div class="text-xs text-slate-400 pt-3 mt-3 border-t border-slate-800 space-y-1">
            <div class="flex justify-between">
              <span x-text="t('loan_amount')"></span>
              <strong class="text-emerald-400 font-mono" x-text="(form.value_of_house_tl - form.initial_noncredit_amount_tl).toLocaleString() + ' TL'"></strong>
            </div>
            <div class="flex justify-between" x-show="form.transaction_cost_buy_pct > 0">
              <span x-text="'+ ' + t('closing_cost')"></span>
              <strong class="text-amber-400 font-mono" x-text="Math.round(form.value_of_house_tl * form.transaction_cost_buy_pct / 100).toLocaleString() + ' TL'"></strong>
            </div>
          </div>
        </div>

        <!-- Macro -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800">
          <h2 class="section-title" x-text="t('macro')"></h2>
          <div class="grid grid-cols-2 gap-3">
            <label class="field">
              <span class="field-label" x-text="t('start_dollar')"></span>
              <input type="number" step="0.01" x-model.number="form.start_dollar_tl" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('dollar_growth')"></span>
              <input type="number" step="0.1" x-model.number="form.dollar_growth_rate" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('turkey_inflation')"></span>
              <input type="number" step="0.1" x-model.number="form.turkey_inflation" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('usa_inflation')"></span>
              <input type="number" step="0.1" x-model.number="form.usa_inflation" class="input-field" />
            </label>
          </div>
        </div>

        <!-- Rent & Salary -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800 md:col-span-2 xl:col-span-1 row-span-1">
          <h2 class="section-title" x-text="t('rent_section') + ' / ' + t('salary')"></h2>
          <div class="grid grid-cols-2 gap-3">
            <label class="field col-span-2">
              <span class="field-label" x-text="t('monthly_rent')"></span>
              <input type="number" x-model.number="form.initial_monthly_rent_tl" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('salary_currency')"></span>
              <select x-model="form.salary_currency" class="input-field">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="TL">TL</option>
              </select>
            </label>
            <label class="field" x-show="form.salary_currency==='EUR'">
              <span class="field-label" x-text="t('euro_dollar')"></span>
              <input type="number" step="0.01" x-model.number="form.euro_dollar_rate" class="input-field" />
            </label>
            <label class="field" :class="form.salary_currency==='EUR' ? 'col-span-2' : ''">
              <span class="field-label" x-text="t('salary_annual')"></span>
              <input type="number" x-model.number="form.start_salary_base" class="input-field" />
            </label>
            <label class="field col-span-2">
              <span class="field-label" x-text="t('salary_growth')"></span>
              <input type="number" step="0.1" x-model.number="form.salary_growth" class="input-field" />
            </label>
          </div>
        </div>

        <!-- Property Costs -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800">
          <h2 class="section-title" x-text="t('property_costs')"></h2>
          <div class="grid grid-cols-2 gap-3">
            <label class="field">
              <span class="field-label" x-text="t('annual_property_tax_rate')"></span>
              <input type="number" step="0.01" x-model.number="form.annual_property_tax_rate" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('annual_maintenance_rate')"></span>
              <input type="number" step="0.1" x-model.number="form.annual_maintenance_rate" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('monthly_hoa_tl')"></span>
              <input type="number" x-model.number="form.monthly_hoa_tl" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('annual_dask_tl')"></span>
              <input type="number" x-model.number="form.annual_dask_tl" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('transaction_cost_buy_pct')"></span>
              <input type="number" step="0.1" x-model.number="form.transaction_cost_buy_pct" class="input-field" />
            </label>
            <label class="field">
              <span class="field-label" x-text="t('transaction_cost_sell_pct')"></span>
              <input type="number" step="0.1" x-model.number="form.transaction_cost_sell_pct" class="input-field" />
            </label>
          </div>
        </div>
      </div>

      <!-- Row 2: selection groups -->
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">

        <!-- Toggles -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800">
          <h2 class="section-title" x-text="t('options')"></h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
            <label class="toggle">
              <input type="checkbox" x-model="form.use_months" class="accent-emerald-500" />
              <span x-text="t('use_months')"></span>
            </label>
            <label class="toggle">
              <input type="checkbox" x-model="form.deflate_dollar_by_us_inflation" class="accent-emerald-500" />
              <span x-text="t('deflate_us')"></span>
            </label>
            <label class="toggle">
              <input type="checkbox" x-model="form.generate_random" class="accent-emerald-500" />
              <span x-text="t('random')"></span>
            </label>
            <label class="toggle">
              <input type="checkbox" x-model="form.project_initial_money_with_asset" class="accent-emerald-500" />
              <span x-text="t('project_initial')"></span>
            </label>
          </div>
        </div>

        <!-- Plot selection -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800">
          <h2 class="section-title" x-text="t('plots')"></h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 max-h-56 overflow-y-auto pr-1">
            <template x-for="key in plotOrder" :key="key">
              <label class="toggle">
                <input type="checkbox" :value="key" x-model="selectedPlots" class="accent-emerald-500" />
                <span x-text="t(key)"></span>
              </label>
            </template>
          </div>
        </div>

        <!-- Assets -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-800">
          <h2 class="section-title" x-text="t('assets')"></h2>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
            <template x-for="sym in supportedAssets" :key="sym">
              <label class="toggle">
                <input type="checkbox" :value="sym" x-model="selectedAssets" class="accent-emerald-500" />
                <span x-text="sym" class="font-medium"></span>
                <span x-show="assetInfo[sym]" class="text-xs text-slate-500 ml-auto"
                      x-text="assetInfo[sym] ? assetInfo[sym].average_growth.toFixed(1) + '%' : ''"></span>
              </label>
            </template>
          </div>
          <p class="text-xs text-amber-400 mt-2" x-show="loadingAsset" x-text="t('fetching_asset')"></p>
        </div>
      </div>

      <!-- Generate button -->
      <div class="flex items-center gap-4">
        <button @click="runProjection()"
                :disabled="loading"
                class="flex-1 md:flex-none md:px-12 py-3 rounded-lg font-semibold text-base
                       bg-emerald-600 hover:bg-emerald-500
                       disabled:bg-slate-700 disabled:cursor-not-allowed
                       transition shadow-lg shadow-emerald-900/40">
          <span x-show="!loading" x-text="t('generate')"></span>
          <span x-show="loading" x-text="t('calculating')"></span>
        </button>
        <p x-show="error" class="text-red-400 text-sm" x-text="error"></p>
      </div>
    </section>

    <!-- Main: chart + summary -->
    <main class="space-y-4">

      <!-- Summary -->
      <div x-show="hasResult" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
        <div class="bg-slate-900 rounded-lg p-3 border border-slate-800">
          <div class="text-xs text-slate-400" x-text="t('summary_monthly_tl')"></div>
          <div class="text-xl font-bold text-emerald-400" x-text="summary ? fmt(summary.monthly_tl_payment) + ' TL' : ''"></div>
        </div>
        <div class="bg-slate-900 rounded-lg p-3 border border-slate-800">
          <div class="text-xs text-slate-400" x-text="t('summary_total_tl')"></div>
          <div class="text-xl font-bold text-amber-400" x-text="summary ? fmt(summary.total_paid_tl) + ' TL' : ''"></div>
        </div>
        <div class="bg-slate-900 rounded-lg p-3 border border-slate-800">
          <div class="text-xs text-slate-400" x-text="t('summary_loan')"></div>
          <div class="text-xl font-bold text-sky-400" x-text="summary ? fmt(summary.loan_amount_tl) + ' TL' : ''"></div>
        </div>
        <div class="bg-slate-900 rounded-lg p-3 border border-slate-800">
          <div class="text-xs text-slate-400" x-text="t('summary_house_usd')"></div>
          <div class="text-xl font-bold text-violet-400" x-text="summary ? fmt(summary.value_of_house_usd) + ' USD' : ''"></div>
        </div>
        <div class="bg-slate-900 rounded-lg p-3 border border-slate-800 col-span-2 md:col-span-3 lg:col-span-1">
          <div class="text-xs text-slate-400" x-text="t('summary_breakeven')"></div>
          <div class="text-xl font-bold"
               :class="summary && summary.breakeven_month != null ? 'text-rose-400' : 'text-slate-500'"
               x-text="summary ? fmtBreakeven(summary.breakeven_month) : ''"></div>
        </div>
      </div>

      <!-- Chart -->
      <div class="bg-slate-900 rounded-lg p-4 border border-slate-800">
        <div x-show="hasResult" class="flex justify-end mb-2">
          <button @click="saveChart()"
                  class="px-3 py-1.5 text-sm rounded-md bg-slate-800 hover:bg-slate-700
                         border border-slate-700 text-slate-200 transition flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span x-text="t('save_chart')"></span>
          </button>
        </div>
        <div class="relative" style="height: 70vh; min-height: 500px;">
          <canvas id="mainChart"></canvas>
        </div>
        <div x-show="!hasResult" class="text-center text-slate-500 text-sm mt-4" x-text="t('hint')"></div>
      </div>

      <!-- Info box -->
      <div x-show="hasResult" class="bg-slate-900 rounded-lg p-4 border border-slate-800 text-sm">
        <h3 class="text-emerald-400 font-semibold mb-2 uppercase tracking-wide text-xs" x-text="t('details')"></h3>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-x-6 gap-y-1 text-slate-300">
          <template x-for="row in infoRows" :key="row.label">
            <div class="flex justify-between border-b border-slate-800 py-1">
              <span class="text-slate-400" x-text="row.label"></span>
              <span class="font-mono" x-text="row.value"></span>
            </div>
          </template>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="projection.js"></script>
<script src="app.js"></script>
</body>
</html>
